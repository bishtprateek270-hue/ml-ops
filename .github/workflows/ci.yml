name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup & Pull from DVC
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -d ".dvc" ]; then
            echo "DVC directory found. Checking remote configuration..."
            if dvc remote list | grep -q .; then
              echo "Remote found. Pulling data..."
              dvc pull || echo "Failed to pull from DVC remote, using local backup"
            else
              echo "No DVC remote configured, skipping pull."
            fi
          else
            echo "DVC not initialized. Running dvc --version check..."
            dvc --version
          fi

          # Ensure the dataset exists for the training pipeline
          if [ ! -f "data/house_prices.csv" ]; then
            echo "Dataset not found. Copying backup..."
            cp data/house_prices_backup.csv data/house_prices.csv
          fi

      - name: Start MLflow Server & Run Training Pipeline
        run: |
          rm -f mlflow.db
          mlflow server --backend-store-uri sqlite:///mlflow.db --default-artifact-root ./mlruns --host 0.0.0.0 --port 5000 &
          # Give the MLflow server a few seconds to boot up
          sleep 5
          python train.py
